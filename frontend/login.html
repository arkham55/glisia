<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLISIA - Masuk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fas fa-apple-alt"></i> GLISIA
            </div>
            <h2>Masuk ke GLISIA</h2>
            <p>Pantau konsumsi gula Anda dengan sistem pakar kami.</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Alamat Email</label>
                    <input type="email" id="email" placeholder="nama@contoh.com" required>
                </div>
                <div class="form-group password-group">
                    <label><i class="fas fa-lock"></i> Kata Sandi</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <i class="fas fa-eye toggle-password" data-target="password"></i>
                    </div>
                </div>
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember"> Ingat saya
                    </label>
                </div>
                <button type="submit" class="btn-login">Masuk</button>
                <div class="auth-footer">
                    Belum memiliki akun? <a href="register.html">Daftar sekarang</a>
                </div>
            </form>
            <div id="loginMessage" class="auth-message"></div>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
