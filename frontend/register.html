<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLISIA - Daftar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fas fa-apple-alt"></i> GLISIA
            </div>
            <h2>Daftar GLISIA</h2>
            <p>Mulai perjalanan sehatmu dengan analisis pakar sekarang.</p>
            
            <form id="registerForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Nama (opsional)</label>
                    <input type="text" id="nama" placeholder="Nama lengkap">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" placeholder="nama@email.com" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Kata Sandi</label>
                    <input type="password" id="password" placeholder="Buat kata sandi" required>
                    <small>Gunakan minimal 8 karakter dengan kombinasi angka dan simbol.</small>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Konfirmasi Kata Sandi</label>
                    <input type="password" id="confirmPassword" placeholder="Ulangi kata sandi" required>
                </div>
                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="agreeTerms" required> Saya menyetujui <strong>Syarat & Ketentuan serta Kebijakan Privasi GLISIA</strong> yang berlaku.
                    </label>
                </div>
                <button type="submit" class="btn-login">Daftar Sekarang</button>
                <div class="auth-footer">
                    Sudah punya akun? <a href="login.html">Masuk di sini</a>
                </div>
                <div class="secure-note">
                    <i class="fas fa-shield-alt"></i> Data Anda terenkripsi dengan aman
                </div>
            </form>
            <div id="registerMessage" class="auth-message"></div>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
